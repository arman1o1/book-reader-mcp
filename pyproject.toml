[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "book-reader-mcp"
version = "0.1.0"
description = "MCP server that splits PDF books into chapters and serves them to LLMs for summarization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "mcp",
    "pdf",
    "book",
    "summarization",
    "llm",
    "model-context-protocol",
    "chapter-detection",
    "ai",
    "reading",
]
authors = [
    { name = "arman1o1", email = "arman1o1@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: General",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "pymupdf>=1.24.0",
    "fpdf2>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
book-reader-mcp = "book_reader_mcp.server:main"

[project.urls]
Homepage = "https://github.com/arman1o1/book-reader-mcp"
Repository = "https://github.com/arman1o1/book-reader-mcp"
Issues = "https://github.com/arman1o1/book-reader-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/book_reader_mcp"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
